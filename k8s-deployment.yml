apiVersion: apps/v1
kind: Deployment
metadata:
  name: project4-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project4-app
  template:
    metadata:
      labels:
        app: project4-app
    spec:
      containers:
      - name: project4-app
        image: lathesh03/project4-app:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: project4-service
spec:
  type: LoadBalancer
  selector:
    app: project4-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
