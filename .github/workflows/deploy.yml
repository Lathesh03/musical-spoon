name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: |
        docker build -t project4-app:latest .
        
    - name: Test Docker Image
      run: |
        docker run -d -p 5000:5000 --name test-container project4-app:latest
        sleep 5
        curl http://localhost:5000
